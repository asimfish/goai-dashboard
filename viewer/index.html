<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A-Lab 三维场景与轨迹</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#151b22;color:#e7edf4;font:14px system-ui,sans-serif}canvas{display:block}#panel{position:fixed;z-index:2;top:16px;left:16px;background:#14202aef;border:1px solid #435364;border-radius:10px;padding:16px;width:min(370px,calc(100vw - 32px))}h1{font-size:18px;margin:0 0 10px}p{font-size:13px;line-height:1.5;color:#b8c7d3;margin:9px 0}select,button{font:inherit;background:#253d50;color:#fff;border:1px solid #667f91;border-radius:5px;padding:6px}select{max-width:100%;width:100%}button{cursor:pointer}#error{color:#ff9898;white-space:pre-wrap}#transport{position:fixed;z-index:2;bottom:16px;left:16px;right:16px;padding:12px;background:#14202aef;border:1px solid #435364;border-radius:8px;display:flex;align-items:center;gap:12px}#seek{flex:1;min-width:30px}#status{color:#7fe0cd}#stats{font-variant-numeric:tabular-nums;font-size:12px}summary{cursor:pointer;color:#99b2c4}.live #transport{display:none}label{font-size:12px;color:#c3d0d9}a{color:#7ed7ff}
</style></head><body>
<div id="panel"><h1>A-Lab 三维场景与轨迹</h1><select id="sceneSelect"><option value="replay">v4 原始布局 · A 站诊断回放（摆位待整理）</option><option value="wf01">wf01 · 固相合成</option><option value="wf02">wf02 · 粉末回收与 XRD</option><option value="wf03">wf03 · 湿化学前驱体</option><option value="wf04">wf04 · 助熔剂晶体生长</option><option value="wf05">wf05 · 试剂流转</option></select><p id="mode">正在加载…</p><p id="scope"></p><p id="status"></p><label><input id="cutaway" type="checkbox" checked> 剖开房间顶部</label><p><button id="navigation" aria-pressed="false">切换自由漫游 · F</button></p><p id="navigationHelp">拖动旋转 · 滚轮缩放 · 右键平移</p><details><summary>数据与版本</summary><p id="identity"></p><p id="coverage"></p><p id="stats"></p></details><p id="error" role="alert"></p></div>
<div id="transport"><button id="play" disabled>暂停</button><input id="seek" type="range" min="0" max="1" value="0" step="0.001" disabled><span id="time">0.0 s</span><select id="speed" style="width:auto"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><label><input id="loop" type="checkbox" checked>循环</label></div>
<script type="module" src="./live_view.js?v=18.3"></script></body></html>
