<!doctype html>
<meta charset="utf-8">
<title>A-Lab 数字孪生 · 三维场景</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#ff8a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans","Noto Sans SC",system-ui,"PingFang SC",sans-serif}
#app{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;top:14px;left:14px;background:rgba(22,27,34,.92);border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;max-width:min(340px,calc(100vw - 28px));backdrop-filter:blur(4px)}
.hud h1{margin:0 0 6px;font-size:15px;font-weight:600}
.hud p{margin:4px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.hud .k{color:var(--accent);font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;background:rgba(22,27,34,.92);
  border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;font-size:14px}
#load .pct{color:var(--accent);font-variant-numeric:tabular-nums}
a{color:#58a6ff}
</style>
<div id="app"></div>
<div id="load">正在载入场景 <span class="pct">0%</span></div>
<div class="hud">
  <h1>A-Lab 数字孪生 · 三维场景</h1>
  <p>layout v4 的静态几何，从 Isaac Sim 的 USD 直接导出。</p>
  <p>Draco 压缩：<span class="k">77.07 MB → 3.08 MB</span>（25×）<br>
     可见 shape <span class="k">1226</span> · draw call <span class="k">223</span></p>
  <p>拖动旋转 · 滚轮缩放 · 右键平移</p>
</div>
<div class="bar">
  <span>坐标系 isaac_z_up · 四元数 isaac_wxyz</span>
  <span>同一份几何用于浏览器实时回放：推流 29.0 Hz · 延迟中位 124.5 ms</span>
  <a href="../scenes.html">← 返回展示页</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// OrbitControls and DRACOLoader are not in three.min.js; pull the matching module build for them.
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import {DRACOLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// The scene is authored Z-up (Isaac); three.js is Y-up, so rotate the root rather than every mesh.
const root = new THREE.Group();
root.rotation.x = -Math.PI/2;
scene.add(root);

scene.add(new THREE.HemisphereLight(0xffffff, 0x404a56, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(-6, 4, -4); scene.add(fill);

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const loadEl = document.getElementById('load');
loader.load('layout_v4_draco.glb', gltf => {
  root.add(gltf.scene);
  // frame the whole lab: fit the camera to the loaded bounding sphere
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const c = sph.center.clone().applyAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
  controls.target.copy(c);
  const d = sph.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov/2));
  camera.position.set(c.x + d*0.55, c.y + d*0.45, c.z + d*0.55);
  camera.far = d * 6; camera.updateProjectionMatrix();
  loadEl.remove();
}, ev => {
  if (ev.lengthComputable) {
    loadEl.querySelector('.pct').textContent = Math.round(ev.loaded/ev.total*100) + '%';
  }
}, err => {
  loadEl.textContent = '场景载入失败：' + err;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function tick(){ requestAnimationFrame(tick); controls.update(); renderer.render(scene, camera); })();
</script>
